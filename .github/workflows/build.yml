name: build-android-kobo
on:
  workflow_dispatch:
  push: { tags: ['v*'] }
jobs:
  kernel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Kernel-Cache
        id: kc
        uses: actions/cache@v4
        with:
          path: out/zImage
          key: zimage-${{ hashFiles('ci/build-kernel.sh', 'ci/logger/*') }}
      - if: steps.kc.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev make git
      - if: steps.kc.outputs.cache-hit != 'true'
        run: sh ci/build-kernel.sh
      - uses: actions/upload-artifact@v4
        with: { name: kernel, path: out/zImage }
  image:
    needs: kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ALPINE: "3.20"
      SYS_URL: ${{ vars.ANDROID19_SYSIMG_URL }}   # Repo-Variable: URL der android-19 armeabi-v7a sys-img ZIP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: kernel, path: out }
      - name: QEMU-Bündel (armv7)
        run: docker run --rm -v "$PWD:/w" -w /w -e ALPINE alpine:${ALPINE} sh ci/bundle-qemu.sh
      - name: Android booten und Snapshot erzeugen
        run: docker run --rm --network host -v "$PWD:/w" -w /w -e SYS_URL alpine:${ALPINE} sh ci/make-snapshot.sh
      - name: Konsolenlog sichern
        if: always()
        run: |
          mkdir -p dbg; cp -f out/android/run/console.log dbg/ 2>/dev/null || true
          cp -f work/qemu.log work/logcat.txt work/ps.txt dbg/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: debug-logs, path: dbg, if-no-files-found: ignore }
      - name: Paket
        run: |
          # Docker-Schritte laufen als root; Dateien dem Runner-User geben (sonst "Permission denied" beim Kopieren)
          sudo chown -R "$(id -u):$(id -g)" out work 2>/dev/null || true
          chmod -R u+rwX,a+rX out 2>/dev/null || true
          mkdir -p pkg/koreader/plugins && cp -r plugin/android.koplugin pkg/koreader/plugins/
          mkdir -p pkg/android && cp -a out/android/. pkg/android/
          (cd pkg && zip -qr ../android-kobo.zip .)
      - uses: actions/upload-artifact@v4
        with: { name: android-kobo, path: android-kobo.zip }
